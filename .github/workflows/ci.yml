name: CI Build and Push

on:
  push:
    branches:
      - develop
    paths:
      - 'okrs-api/**'
      - 'okrs-core/**'
      - 'core/**'
      - 'pom.xml'
      - 'Dockerfile'
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'infrastructure/**'
      - 'README.md'

env:
  IMAGE_REPOSITORY: 'okrs-app'
  REGISTRY_SERVER: 'acrokrsdevydycrv67hdqyc.azurecr.io'
  DOCKERFILE_PATH: 'Dockerfile'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: development
    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java JDK 11 matching the Maven configuration
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      # 3. Compile and Package Spring Boot code using Maven
      - name: Maven Clean and Package
        run: mvn clean package -DskipTests -B

      # 4. Log in to Azure Container Registry (ACR)
      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 5. Build and Push Docker Image using Commit Hash Tag
      - name: Docker Build and Push
        run: |
          TAG=${{ github.sha }}
          REGISTRY=${{ env.REGISTRY_SERVER }}
          REPO=${{ env.IMAGE_REPOSITORY }}
          
          echo "Building Docker image..."
          docker build -t $REGISTRY/$REPO:$TAG -f ${{ env.DOCKERFILE_PATH }} .
          
          echo "Pushing Docker image to ACR..."
          docker push $REGISTRY/$REPO:$TAG