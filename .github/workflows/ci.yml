name: Build, Push, and Deploy Dev

on:
  push:
    branches:
      - develop
    paths:
      - 'okrs-api/**'
      - 'okrs-core/**'
      - 'core/**'
      - 'pom.xml'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'okrs-api/**'
      - 'okrs-core/**'
      - 'core/**'
      - 'pom.xml'
      - 'Dockerfile'
  workflow_dispatch:

concurrency:
  group: dev-image-${{ github.ref }}
  # Never cancel a push-to-develop run: it pushes an image and commits the pinned
  # SHA, so an interrupted run can leave dev pointing at an image that was never
  # published. Pull request runs only verify, so superseding them is safe.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  id-token: write

env:
  IMAGE_REPOSITORY: okrs-app
  REGISTRY_NAME: acrokrsdevydycrv67hdqyc
  REGISTRY_SERVER: acrokrsdevydycrv67hdqyc.azurecr.io
  DEV_VALUES_FILE: deploy/charts/okrs-backend/values/dev.yaml

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    steps:
      - name: Check out source revision
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Verify application
        run: ./mvnw --batch-mode clean verify

  build-push-pin:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    environment: development
    steps:
      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This job builds and pushes a container image on a persistent host that
      # GitHub does not provision, so both tools are checked before any work runs.
      - name: Check runner prerequisites
        run: |
          set -Eeuo pipefail
          missing=()
          command -v docker >/dev/null 2>&1 || missing+=("docker")
          command -v az >/dev/null 2>&1 || missing+=("az")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required tools on the runner host: ${missing[*]}" >&2
            echo "This job needs Docker to build the image and Azure CLI for 'az acr login'." >&2
            exit 1
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "Docker is installed but the daemon is unreachable." >&2
            echo "Start it, and ensure the runner user can access the Docker socket." >&2
            exit 1
          fi
          echo "Docker and Azure CLI available."

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Verify application
        run: ./mvnw --batch-mode clean verify

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push immutable image
        run: |
          set -Eeuo pipefail
          az acr login --name "$REGISTRY_NAME"
          image="$REGISTRY_SERVER/$IMAGE_REPOSITORY:$GITHUB_SHA"
          docker build --file Dockerfile --tag "$image" .
          docker push "$image"

      - name: Pin dev desired state
        run: |
          set -Eeuo pipefail
          sed -i -E "s/^  tag: .*/  tag: ${GITHUB_SHA}/" "$DEV_VALUES_FILE"
          if git diff --quiet -- "$DEV_VALUES_FILE"; then
            echo "Dev already points to $GITHUB_SHA."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEV_VALUES_FILE"
          git commit -m "deploy(dev): pin okrs-backend ${GITHUB_SHA} [skip ci]"
          git pull --rebase origin develop
          git push origin HEAD:develop
