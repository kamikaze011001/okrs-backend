name: Build, Push, and Deploy Dev

on:
  push:
    branches:
      - develop
    paths:
      - 'okrs-api/**'
      - 'okrs-core/**'
      - 'core/**'
      - 'pom.xml'
      - 'Dockerfile'
  workflow_dispatch:

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  IMAGE_REPOSITORY: okrs-app
  REGISTRY_NAME: acrokrsdevydycrv67hdqyc
  REGISTRY_SERVER: acrokrsdevydycrv67hdqyc.azurecr.io
  DEV_VALUES_FILE: deploy/charts/okrs-backend/values/dev.yaml

jobs:
  build-push-pin:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Verify application
        run: mvn --batch-mode clean verify

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push immutable image
        run: |
          set -Eeuo pipefail
          az acr login --name "$REGISTRY_NAME"
          image="$REGISTRY_SERVER/$IMAGE_REPOSITORY:$GITHUB_SHA"
          docker build --file Dockerfile --tag "$image" .
          docker push "$image"

      - name: Pin dev desired state
        run: |
          set -Eeuo pipefail
          sed -i -E "s/^  tag: .*/  tag: ${GITHUB_SHA}/" "$DEV_VALUES_FILE"
          if git diff --quiet -- "$DEV_VALUES_FILE"; then
            echo "Dev already points to $GITHUB_SHA."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEV_VALUES_FILE"
          git commit -m "deploy(dev): pin okrs-backend ${GITHUB_SHA} [skip ci]"
          git pull --rebase origin develop
          git push origin HEAD:develop
