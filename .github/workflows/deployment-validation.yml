name: Validate Infrastructure and GitOps

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - '*.sh'
      - 'Makefile'
      - '.github/workflows/**'
  push:
    branches:
      - develop
    paths:
      - 'deploy/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - '*.sh'
      - 'Makefile'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.0

      - name: Install Bicep CLI
        run: az bicep install

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Install kubeconform
        run: |
          set -Eeuo pipefail
          version=v0.6.7
          sha256=95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
          curl -sSL --retry 3 --fail \
            --output kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz"
          echo "${sha256}  kubeconform.tar.gz" | sha256sum --check --strict
          sudo tar -xz -C /usr/local/bin -f kubeconform.tar.gz kubeconform
          rm -f kubeconform.tar.gz
          kubeconform -v

      - name: Validate deployment artifacts
        run: ./scripts/validate-deploy.sh
