name: Validate Infrastructure and GitOps

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - '*.sh'
      - 'Makefile'
      - '.github/workflows/**'
  push:
    branches:
      - develop
    paths:
      - 'deploy/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - '*.sh'
      - 'Makefile'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.0

      - name: Install Bicep CLI
        run: az bicep install

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate deployment artifacts
        run: ./scripts/validate-deploy.sh
