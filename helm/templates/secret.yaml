apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: okrs-backend-credentials
  labels:
    {{- include "okrs-backend.labels" . | nindent 4 }}
{{- if .Values.azurekv.enabled }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: azure-store
    kind: ClusterSecretStore
  target:
    name: okrs-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres-db-password-in-akv
{{- else }}
type: Opaque
data:
  {{- range $key, $val := .Values.appSecret }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- end }}