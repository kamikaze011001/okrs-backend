apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: okrs-bootstrap
  namespace: argocd
spec:
  description: Admin-only project for the OKRs App-of-Apps root
  sourceRepos:
    - git@github.com:kamikaze011001/okrs-backend.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: okrs-platform
  namespace: argocd
spec:
  description: Cluster operators and environment secret plumbing
  sourceRepos:
    - git@github.com:kamikaze011001/okrs-backend.git
    - https://charts.external-secrets.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: okrs-dev
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: okrs-dev
  namespace: argocd
spec:
  description: Dev application workloads restricted to okrs-dev
  sourceRepos:
    - git@github.com:kamikaze011001/okrs-backend.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: okrs-dev
  orphanedResources:
    warn: true
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: Ingress
