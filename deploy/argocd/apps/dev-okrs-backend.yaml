apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: okrs-backend-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Delete=confirm
spec:
  project: okrs-dev
  source:
    repoURL: git@github.com:kamikaze011001/okrs-backend.git
    targetRevision: develop
    path: deploy/charts/okrs-backend
    helm:
      releaseName: okrs-backend
      valueFiles:
        - values/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: okrs-dev
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
    syncOptions:
      - PruneLast=true
      - RespectIgnoreDifferences=true
