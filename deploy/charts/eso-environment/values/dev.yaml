serviceAccount:
  name: okrs-secrets-reader

workloadIdentity:
  # Client ID of id-okrs-dev-hk-eso. This is a deployment output, not a constant: if
  # the identity is ever recreated the value here goes stale and the SecretStore fails
  # with "InvalidProviderConfig: unable to create client", which names neither the
  # identity nor the mismatch. Read it back with:
  #   az identity show -g rg-okrs-dev-hk -n id-okrs-dev-hk-eso --query clientId -o tsv
  clientId: 44512923-8a4a-46c5-b9e1-7d675a1d8851
  tenantId: f776e96a-9b62-4361-8ed4-89004810cb3a

secretStore:
  name: azure-key-vault
  vaultUrl: https://kv-okrs-dev-hk-ydycrv67h.vault.azure.net/

externalSecrets:
  okrs-backend:
    targetName: okrs-backend-credentials
    refreshInterval: 1h
    data:
      SPRING_DATASOURCE_URL: spring-datasource-url
      POSTGRES_USER: postgres-user
      POSTGRES_PASSWORD: postgres-password
      SPRING_REDIS_HOST: redis-host
      REDIS_PORT: redis-port
      REDIS_PASSWORD: redis-password
      JWT_ACCESS_TOKEN_SECRET: jwt-access-token-secret
      JWT_REFRESH_TOKEN_SECRET: jwt-refresh-token-secret
      SPRING_EMAIL_USERNAME: spring-email-username
      SPRING_EMAIL_PASSWORD: spring-email-password
      SPRING_EMAIL_FROM: spring-email-username
