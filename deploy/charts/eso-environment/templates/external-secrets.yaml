{{- range $name, $externalSecret := .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: okrs
spec:
  refreshInterval: {{ $externalSecret.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $.Values.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ required (printf "externalSecrets.%s.targetName is required" $name) $externalSecret.targetName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $secretKey, $remoteKey := $externalSecret.data }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $remoteKey }}
    {{- end }}
{{- end }}
