image:
  repository: acrokrsdevydycrv67hdqyc.azurecr.io/okrs-app
  tag: db2931a62a6de8d912f385e2583c0c1f540e8255
  pullPolicy: IfNotPresent

ingress:
  enabled: false
  hosts: []

# The AKS-managed azurefile-csi provisioner cannot create its backing storage
# account on this cluster -- every attempt fails with "failed to ensure storage
# account: authenticated requests are not permitted for non TLS protected (https)
# endpoints" -- so the PVC never binds and the pod stays Pending forever. Azure Disk
# provisions fine, costs less than a storage account, and ReadWriteOnce is sufficient
# at replicaCount 1. qa still uses azurefile, where multiple replicas need RWX.
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  storageClass: managed-csi

secrets:
  existingSecret: okrs-backend-credentials

migration:
  enabled: true
  argocdHook: true

appConfig:
  SPRING_LIQUIBASE_ENABLED: "false"
  FILE_STORAGE_PATH: /app/uploads
  JWT_ACCESS_TOKEN_LIFETIME: "900000"
  JWT_REFRESH_TOKEN_LIFETIME: "604800000"

metrics:
  serviceMonitor:
    enabled: true

env:
  springProfile: dev
